<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Review</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="vanta-birds"></div>

    <header>
      <div class="logo-container">
        <a href="index.html">
          <img src="images/logo.png" alt="Logo" class="logo" />
        </a>
      </div>
    </header>

    <main class="add-review-main">
      <div class="add-review-container">
        <form id="review-form" class="form">
          <h2>Ajouter un avis</h2>

          <div class="form-group">
            <label for="review">Votre avis :</label>
            <textarea
              id="review"
              name="review"
              rows="6"
              placeholder="Partagez votre expérience..."
              required
            ></textarea>
          </div>

          <div class="form-group">
            <label for="rating">Note :</label>
            <select id="rating" name="rating" required>
              <!-- Options ajoutées dynamiquement par JS -->
            </select>
          </div>

          <button type="submit" class="submit-btn">Publier l'avis</button>
        </form>
      </div>
    </main>

    <footer>
      <p>all rights reserved</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
    <script src="scripts.js"></script>
  </body>
</html>
